:root{--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}

*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:#dcdce0;color:#1a191f;padding:24px 16px 48px}

.phone{width:390px;height:844px;border-radius:28px;overflow:hidden;position:relative;background:var(--canvas);color:var(--text);outline:8px solid #2b2a2f;display:flex;flex-direction:column;font-size:.875rem;line-height:1.45}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.i.s{width:14px;height:14px}.i.xs{width:12px;height:12px}
.mono{font-family:var(--mono)}
.status{height:24px;flex:none;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:.75rem;font-weight:500}
.sb{display:flex;gap:3px}.sb i{width:12px;height:7px;border-radius:2px;background:var(--text)}

.sheet.half{height:422px}.sheet.full{top:72px}
.handle{position:absolute;top:5px;left:50%;margin-left:-16px;width:32px;height:4px;border-radius:2px;background:var(--border)}
.sh{flex:none;display:flex;align-items:center;gap:6px;padding:12px 8px 4px 16px}.sh h2{flex:1;font-size:1rem;font-weight:500;line-height:1.4}

.lab{display:block;font-size:.8125rem;color:var(--t2);margin:2px 0 4px}

.gh,.sec{font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--t2);margin:14px 0 6px}
.pi{display:flex;gap:10px;align-items:flex-start;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.pd{font-size:.8125rem;color:var(--t2)}
.sub{font-size:.8125rem;color:var(--t2);margin-bottom:2px}
.cfg .sec{margin:12px 0 6px}
.dm{border-top:1px solid var(--border);padding:8px 0 10px;display:flex;flex-direction:column;gap:6px}.dmh{display:flex;justify-content:space-between;align-items:center;gap:8px}

# Spike S-1 fase 2: servizi del bus e del database, solo su localhost.
# Credenziali generate in .env (fuori dal repository) da ./gen-env.sh; nessun valore predefinito accettato.
name: ttspikebus
services:
  iggy:
    image: apache/iggy:${IGGY_IMAGE:-0.10.0}
    # IGGY_SUP: solo nella prova di disco pieno, un ciclo che rilancia il server quando esce (il volume tmpfs vive quanto il container)
    entrypoint: ["sh", "-c", "${IGGY_SUP:-exec iggy-server}"]
    cap_add: [SYS_NICE]
    security_opt: ["seccomp:unconfined"]
    ulimits: { memlock: { soft: -1, hard: -1 } }
    environment:
      IGGY_NODE_ADVERTISED_ADDRESS: localhost
      IGGY_ROOT_USERNAME: ${IGGY_ROOT_USERNAME:?genera .env}
      IGGY_ROOT_PASSWORD: ${IGGY_ROOT_PASSWORD:?genera .env}
      # una sola configurazione per tutte le misure
      IGGY_SHARDING_CPU_ALLOCATION: ${IGGY_SHARDS:-1}
      IGGY_PARTITION_WAL_GROUP_COMMIT_DELAY_MICROS: ${IGGY_GC_DELAY:-500}
      IGGY_MEMORY_POOL_SIZE: ${IGGY_POOL:-512MiB}
      IGGY_MEMORY_POOL_ENABLED: ${IGGY_POOL_ON:-true}
      IGGY_SHARDING_PIN_CORES: ${IGGY_PIN:-true}
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_HTTP_ENABLED: "false"
      IGGY_QUIC_ENABLED: "false"
      IGGY_WEBSOCKET_ENABLED: "false"
    cpuset: "${SPIKE_CPUSET:-}"
    ports: ["127.0.0.1:47001:8090"]
    volumes: ["${IGGY_DATA:-${SPIKE_DATA:-/home/white_sheep/.cache/ttspikebus-data}/iggy}:${IGGY_MNT:-/local_data}"]
  valkey:
    image: valkey/valkey:9.1.4
    command: >
      valkey-server --appendonly yes --appendfsync ${VALKEY_FSYNC:-always} --save ""
      --auto-aof-rewrite-min-size ${VALKEY_AOF_MIN:-64mb} --requirepass ${VALKEY_PASSWORD:?genera .env} --dir /data
    cpuset: "${SPIKE_CPUSET:-}"
    ports: ["127.0.0.1:47002:6379"]
    volumes: ["${SPIKE_DATA:-/home/white_sheep/.cache/ttspikebus-data}/valkey:/data"]
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: spike
      POSTGRES_DB: spike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?genera .env}
    cpuset: "${SPIKE_CPUSET:-}"
    ports: ["127.0.0.1:47003:5432"]
    volumes: ["${PG_DATA:-${SPIKE_DATA:-/home/white_sheep/.cache/ttspikebus-data}/postgres}:/var/lib/postgresql"]
# volumi con limite di dimensione (tmpfs di docker) per le prove di disco pieno (fase 4, blocco B):
# creati da scen.sh, usati solo con IGGY_DATA=iggycap o PG_DATA=pgcap
volumes:
  iggycap: { external: true, name: ttspikebus-iggycap }
  pgcap: { external: true, name: ttspikebus-pgcap }

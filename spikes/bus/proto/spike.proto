syntax = "proto3";
package spike;

// Controllo: avvio di un'esecuzione (accettazione durevole) e statistiche della corsa.
message AcceptReq {
  bytes tenant = 1;   // identificativo interno, 16 byte
  uint32 kind = 2;    // 0 catena, 1 fan-out con join, 2 catena di attese (timer, work_ms = durata), 3 catena con primo tentativo fallito
  uint32 n = 3;       // passi della catena o rami del fan-out
  uint32 work_ms = 4; // durata simulata di ogni attività
  uint32 out_size = 5;
  bytes input = 6;
  uint32 retry_ms = 7; // kind 3: attesa tra il tentativo fallito e il successivo
}
message AcceptResp { bytes exec = 1; }
message StatsReq { bool reset = 1; }
message StatsResp { string text = 1; }
service Control {
  rpc Accept(AcceptReq) returns (AcceptResp);
  rpc Stats(StatsReq) returns (StatsResp);
}

// Worker: il worker apre la sessione, il motore consegna le attività e riceve gli esiti (C-2).
message Delivery {
  bytes exec = 1;
  uint32 step = 2;
  bytes tenant = 3;
  uint64 delivery_id = 4;
  bytes input = 5;
  uint32 work_ms = 6;
  uint32 out_size = 7;
  uint64 ready_us = 8;  // istante della decisione "pronta"
  uint64 sent_us = 9;   // istante dopo la scrittura durevole, subito prima dell'invio
  uint64 ack = 10;      // se diverso da 0 non è una consegna: conferma durevole dell esito con questo delivery_id
  uint32 attempt = 11;  // numero del tentativo (0 il primo)
  bool fail = 12;       // il worker deve far fallire questo tentativo (kind 3, primo tentativo)
  uint32 lease_ms = 13; // se diverso da 0: il worker manda un battito ogni lease_ms/3 e la scadenza è lease_ms dall ultimo battito
  bytes secret = 14;     // blocco D (log dei task): segreto sintetico consegnato al tentativo (la prova della sostituzione col segnaposto)
  uint64 log_ack = 15;   // se diverso da 0 non è una consegna: le righe del tentativo (exec, step, attempt) fino a questo numero sono durevoli
}
// Una riga di log: il numero progressivo nel tentativo lo dà il worker (verità di base per perdite e doppioni).
message LogLine { uint64 seq = 1; bytes text = 2; }
message FromWorker {
  bytes exec = 1;
  uint32 step = 2;
  uint64 delivery_id = 3;
  bytes output = 4;
  uint64 lat_ready_us = 5; // ricezione nel worker meno ready_us
  uint64 lat_sent_us = 6;  // ricezione nel worker meno sent_us
  bool hello = 7;
  bytes credential = 8; // credenziale del worker (C-11), solo nel saluto: controllata a ogni collegamento
  bool failed = 9;      // il tentativo è fallito: il motore programma l attesa e ritenta
  bool heartbeat = 10;  // battito: il tentativo è ancora in corso, il motore sposta in avanti la sua scadenza (timer durevole)
  bytes tenant = 11;          // log dei task: tenant del tentativo (la spike si fida; in produzione si ricava dal tentativo, C-2)
  uint32 attempt = 12;        // log dei task: tentativo che ha scritto le righe
  repeated LogLine lines = 13; // log dei task: righe con numero progressivo per tentativo, assegnato dal worker
}
service Worker {
  rpc Session(stream FromWorker) returns (stream Delivery);
}

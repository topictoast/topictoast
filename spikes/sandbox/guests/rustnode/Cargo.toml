# Nodo di prova in Rust, compilato per wasm32-wasip1, wasm32-unknown-unknown e wasm32-wasip2.
# Fuori dai workspace e dal gate.
[package]
name = "rustnode"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustnode"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wit-bindgen = "=0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Spike S-3 parte 1: crate autonomo, fuori dai workspace e dal gate. Codice da buttare.
[package]
name = "streamspike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# DataFusion 55.2.0 (2026-10-07), senza formati di file ne' compressione nel binario (PIANO 1.1)
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "datetime_expressions", "string_expressions", "unicode_expressions", "recursive_protection"] }
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }
iggy = "=0.12.0"
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
hdrhistogram = "=7.6.0"
aes-gcm = "=0.11.1"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
uuid = { version = "=1.29.1", features = ["v4"] }
libc = "=0.2.191"
bytes = "=1.12.1"
# solo per il tipo `Url` del registro degli archivi di oggetti (gia' nel lock di DataFusion)
url = "=2.5.9"

[profile.release]
debug = 1
